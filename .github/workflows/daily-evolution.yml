name: Daily Evolution

on:
  schedule:
    # 22:30 UTC ≈ 18:30 ET during DST / 17:30 ET in winter — after US market close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore working DB from tracked snapshot
        run: |
          mkdir -p db
          cp dashboard/db/evolution.db db/evolution.db

      - name: Run daily evolution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_daily.py --generations 3

      - name: Update dashboard snapshot
        run: cp db/evolution.db dashboard/db/evolution.db

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/db/evolution.db data/TSLA_daily.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily evolution $(date -u +%F)"
            git push
          fi

      - name: Deploy dashboard to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_EZ6aM4wVO7bDEIbvTvo0ysyR
          VERCEL_PROJECT_ID: prj_6gQhKrM11yPAk5utg6fhUONxgZQH
        working-directory: dashboard
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set — skipping deploy (add it in repo Settings → Secrets)."
            exit 0
          fi
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
